name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check website
        run: |
          echo "Starting website test..."

          if [ -f "index.html" ]; then
            echo "✅ index.html found!"
          else
            echo "❌ index.html not found!"
            exit 1
          fi
      - name: Build project
        run: echo "Build complete"
